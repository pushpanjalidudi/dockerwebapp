version: "3.9"


services:
  devopsdb:
    image: pushpanjalidudi/application:db
    ports:
      - "3306:3306"
    deploy:
      replicas: 1
      resources:
        reservations:
          cpus: "0.5"
          memory: 100M
        limits:
          cpus: "1.0"
          memory: 200M
    networks:
      - mynetwork
    volumes:
      - mydata:/var/lib/mysql

  application:
    image: pushpanjalidudi/application:javaapp
    ports:
      - "1111:8080"
    deploy:
      replicas: 3
      resources:
        reservations:
          cpus: "0.5"
          memory: 100M
        limits:
          cpus: "1.0"
          memory: 200M
    depends_on:
      - devopsdb
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: overlay

volumes:
  mydata:
